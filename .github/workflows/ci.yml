name: Smart CCTV CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-suite:
    name: Code Quality & Automated Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: Install Python Dependencies (PyTorch CPU & Requirements)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Verify Syntax & Python Bytecode Compilation
        run: |
          python -m py_compile *.py

      - name: Run 16 Comprehensive Standard Tests (AIM, FT, IT, NFT)
        run: |
          python run_comprehensive_tests.py

      - name: Run Unit & Pipeline Integration Tests
        run: |
          python test_pipeline.py

  docker-build:
    name: Docker Containerization Build & Verify
    needs: test-suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: cctv-traffic-analytics:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Container Runtime & Module Integrity
        run: |
          docker run --rm cctv-traffic-analytics:latest python -c "import streamlit, ultralytics, torch, cv2, pandas, altair; print('Container runtime verification PASSED!')"
